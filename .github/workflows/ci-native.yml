name: CI Native

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master]

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    container:
      image: python:2.7.18-slim

    env:
      PYTHONPATH: ${{ github.workspace }}/application
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install curl
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "Werkzeug==0.16.1" "SQLAlchemy==1.0.19"

      - name: Initialize SQLite database
        run: python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          python manage.py runserver &
          sleep 5
          curl -v -f http://127.0.0.1:7345/
          kill %1 || true